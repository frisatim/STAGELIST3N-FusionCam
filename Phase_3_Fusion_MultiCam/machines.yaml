video:
  resolution:
  - 1280
  - 720
  fps: 25
geometrie_2d:
  plan_image: plan_rdc.png
  echelle_px_par_metre: 42.3
  unite: metres
  origine_pixel_x: 82
  origine_pixel_y: 45
# =============================================================================
#  COORDONNÉES DES MACHINES — À REMPLIR
# =============================================================================
#
#  INSTRUCTIONS :
#  1. Pour chaque machine, donner les 4 coins en mètres depuis l'origine (0,0)
#     Origine = coin haut-gauche du plan (marqué en bleu)
#     x = vers la droite, y = vers le bas
#
#  2. Ordre des coins : dans le sens horaire en partant du coin haut-gauche
#     de la machine vue du dessus :
#     coin_1 (haut-gauche), coin_2 (haut-droite), coin_3 (bas-droite), coin_4 (bas-gauche)
#
#  3. Pour les machines en losange (tournées à 45°), donnez les 4 coins dans
#     le sens horaire en partant du coin le plus haut.
#
#  4. Champ "visible_par" : listez les caméras qui voient cette machine.
#     C'est important pour choisir les points de calibration.
#
#  EXEMPLE (à supprimer une fois rempli) :
#  - nom: "Fraiseuse CNC"
#    salle: room_1
#    coins_metres:
#      - [1.20, 0.80]    # coin haut-gauche
#      - [3.50, 0.80]    # coin haut-droite
#      - [3.50, 2.10]    # coin bas-droite
#      - [1.20, 2.10]    # coin bas-gauche
#    visible_par: [cam_03, cam_05]
#
# =============================================================================

