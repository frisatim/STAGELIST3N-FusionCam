# =============================================================================
#  POINTS DE REFERENCE POUR LA CALIBRATION HOMOGRAPHIQUE
#  Phase 3.1 
# =============================================================================
#
#  INSTRUCTIONS :
#  1. Pour chaque caméra, liste de 6 à 10 points visibles DANS L'IMAGE
#     dont nous connaissons la position exacte en mètres sur le plan de sol.
#
#  2. Origine (0, 0) = coin haut-gauche du plan (marqué en bleu sur plan_rdc.png)
#     x = horizontal (vers la droite), y = vertical (vers le bas)
#
#  3. Types de points recommandés (AU NIVEAU DU SOL) :
#     - Coins de machines
#     - Pieds de poteaux / colonnes
#     - Coins de carreaux au sol
#     - Marquages au sol / lignes peintes
#     - Coins de portes (seuil)
#     - Coins de murs
#
#  4. Minimum 4 points par caméra, 6-8 recommandé, 10 = excellent
#
#  5. Chaque caméra peut avoir des points différents, il suffit que
#     le point soit visible dans cette caméra spécifique.
#
# =============================================================================

